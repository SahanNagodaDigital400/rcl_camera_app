[project]
name = "rocell-infra"
version = "0.1.0"
description = "Database migrations and the migration runner"
requires-python = ">=3.12"
dependencies = [
    # The migration runner needs a driver and the one shared Argon2id hasher.
    # `infra` may depend on `shared/*`; it never depends on `apps/*`.
    "psycopg[binary]>=3.2",
    "shared-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocell_infra"]

[tool.uv.sources]
shared-schema = { workspace = true }
