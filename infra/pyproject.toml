[project]
name = "rcl-infra"
version = "0.1.0"
description = "Forward-only Postgres migrations and the seeded Administrator -- no ORM, no business logic"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["migrations*"]
