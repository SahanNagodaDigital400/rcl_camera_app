[project]
name = "tilematch-poc"
version = "0.1.0"
description = "Local proof-of-concept for Rocell tile image retrieval"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.23",
    "pillow>=11.0",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "huggingface-hub>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["tilematch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
