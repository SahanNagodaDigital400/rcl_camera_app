[project]
name = "rocell-api"
version = "0.1.0"
description = "Rocell Tile Scanner API — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    # The same driver `infra` already uses, plus its connection pool. One
    # driver for the whole product: two would mean two sets of type
    # adaptation rules over the same columns.
    "psycopg[binary,pool]>=3.2",
    # Multipart form parsing. FastAPI's `UploadFile` is inert without it —
    # the framework refuses to build a route that declares one — and Story
    # 2.1's `POST /admin/tiles` carries files beside its text fields.
    "python-multipart>=0.0.20",
    "shared-schema",
    # AD-1: the one module that turns pixels into a vector. `apps/api` and
    # `scripts/ingest` depend on the same build of it and call it
    # unwrapped; a second implementation on either side is the asymmetry
    # that silently destroys match accuracy.
    "shared-vision",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.uv.sources]
shared-schema = { workspace = true }
shared-vision = { workspace = true }
