[project]
name = "rocell-api"
version = "0.1.0"
description = "Rocell Tile Scanner API — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "shared-schema",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.uv.sources]
shared-schema = { workspace = true }
