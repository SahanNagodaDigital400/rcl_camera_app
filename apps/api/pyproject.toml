[project]
name = "rcl-api"
version = "0.1.0"
description = "FastAPI service -- auth, scan submission, admin user/catalogue endpoints, audit log"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
