[project]
name = "shared-schema"
version = "0.1.0"
description = "Shared types and contracts between apps/web and apps/api"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_schema"]
