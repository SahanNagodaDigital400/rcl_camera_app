[project]
name = "shared-schema"
version = "0.1.0"
description = "Shared types and contracts between apps/web and apps/api"
requires-python = ">=3.12"
dependencies = [
    # The one hashing path the migration seed and the login verifier both call.
    # AGENTS.md Policy: Argon2id only.
    "argon2-cffi>=23.1",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_schema"]
